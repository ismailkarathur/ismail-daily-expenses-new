/* ---------------- APP STATE ---------------- */

let currentUser = null;

const LOCAL_CACHE_KEY = "ismail_expenses_cache_v2";
const LOCAL_CATS_KEY = "ismail_custom_cats";

let customCategories = [
  "Food",
  "Travel",
  "Bills",
  "Shopping",
  "Salary",
  "Petrol",
  "Account Transfer",
  "Porter",
  "Taxi",
  "Others",
  "Thalha",
  "Pickup",
  "Expense"
];


/* ---------------- LOAD LOCAL CATEGORIES ---------------- */

try {
  const savedCats = localStorage.getItem(LOCAL_CATS_KEY);

  if (savedCats) {
    const parsed = JSON.parse(savedCats);

    if (Array.isArray(parsed) && parsed.length) {
      customCategories = parsed;
    }
  }
} catch (e) {
  console.warn("Category cache error:", e);
}


/* ============================================================
   AUTH
   ============================================================ */

auth.onAuthStateChanged(async (user) => {

  currentUser = user;

  if (user) {

    document.getElementById("authContainer").classList.add("hidden");
    document.getElementById("appContainer").classList.remove("hidden");

    populateCategoryDropdowns();

    /*
      First show cached data immediately.
      This prevents the dashboard from appearing empty
      while Firebase is loading.
    */
    loadLocalCache();

    /*
      Then load the real Firebase data.
    */
    listenToData();

  } else {

    if (unsubscribeExpenses) {
      unsubscribeExpenses();
      unsubscribeExpenses = null;
    }

    currentUser = null;
    allTx = [];

    document.getElementById("authContainer").classList.remove("hidden");
    document.getElementById("appContainer").classList.add("hidden");
  }
});


/* ---------------- LOGIN ---------------- */

document.getElementById("loginForm").addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPassword").value;

  try {

    await auth.signInWithEmailAndPassword(email, pass);

  } catch (err) {

    console.error("Login error:", err);
    alert("Login failed:\n" + err.message);
  }
});


/* ---------------- FORGOT PASSWORD ---------------- */

function handleForgotPassword() {

  const email = prompt("Enter your email for password reset:");

  if (!email) return;

  auth.sendPasswordResetEmail(email)
    .then(() => {
      alert("Password reset email sent.");
    })
    .catch(err => {
      alert("Reset failed:\n" + err.message);
    });
}


/* ---------------- LOGOUT ---------------- */

async function logout() {

  try {
    await auth.signOut();
  } catch (err) {
    alert("Logout error: " + err.message);
  }
}


/* ============================================================
   LOCAL CACHE
   ============================================================ */

function saveLocalCache() {

  try {

    const cleanData = allTx.map(item => {

      const copy = { ...item };

      /*
        Firestore Timestamp cannot safely be JSON stringified
        for our simple local cache.
      */
      if (copy.updatedAt && typeof copy.updatedAt.toMillis === "function") {
        copy.updatedAt = copy.updatedAt.toMillis();
      }

      return copy;
    });

    localStorage.setItem(
      LOCAL_CACHE_KEY,
      JSON.stringify(cleanData)
    );

  } catch (err) {

    console.warn("Could not save local cache:", err);
  }
}


function loadLocalCache() {

  try {

    const raw = localStorage.getItem(LOCAL_CACHE_KEY);

    if (!raw) return;

    const cached = JSON.parse(raw);

    if (!Array.isArray(cached)) return;

    allTx = cached.map(item => ({
      ...item,
      updatedAt: item.updatedAt
        ? {
            toMillis: () => Number(item.updatedAt)
          }
        : null
    }));

    sortTransactions();

    updateSummary();
    renderTable();
    renderChart();

  } catch (err) {

    console.warn("Local cache load error:", err);
  }
}
