<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expenses & Transaction Manager</title>
    <!-- XLSX Library for Reading Uploaded Excel Files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #ffffff;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }

        .btn-upload { background-color: #2b3a55; color: #8ab4f8; }
        .btn-share { background-color: #4a3800; color: #fcc419; }
        .btn-export { background-color: #1b4332; color: #51cf66; }

        #fileInput { display: none; }

        .search-box {
            width: 100%;
            padding: 12px 14px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 15px;
            font-size: 14px;
            outline: none;
        }

        .search-box:focus { border-color: #f59e0b; }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Multi-Select Custom Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-btn {
            width: 100%;
            padding: 10px 12px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #ccc;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .dropdown-btn::after {
            content: '▼';
            font-size: 10px;
            color: #888;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 4px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
        }

        .dropdown.open .dropdown-content { display: block; }

        .dropdown-item {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
            user-select: none;
        }

        .dropdown-item:hover { background-color: #333; }

        .dropdown-item input[type="checkbox"] {
            accent-color: #f59e0b;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Stats Summary Cards */
        .summary-bar {
            display: flex;
            justify-content: space-between;
            background-color: #252525;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .summary-item { text-align: center; }
        .summary-item label { display: block; font-size: 11px; color: #888; margin-bottom: 2px; }
        .summary-item span { font-weight: bold; }
        .income-text { color: #51cf66; }
        .expense-text { color: #f59e0b; }

        /* Table Styling */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 12px 10px;
            color: #888;
            background-color: #252525;
            border-bottom: 1px solid #333;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #262626;
        }

        tr:hover { background-color: #242424; }

        .amount {
            color: #f59e0b;
            font-weight: bold;
        }

        .action-edit {
            color: #60a5fa;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
        }

        .action-edit:hover { text-decoration: underline; }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Transactions History</h2>

    <!-- Action Buttons -->
    <div class="btn-group">
        <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📥 Upload Excel</button>
        <input type="file" id="fileInput" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
        
        <button class="btn btn-share" onclick="alert('Ready to share!')">📷 Share</button>
        <button class="btn btn-export" onclick="exportData()">📊 Export Excel</button>
    </div>

    <!-- Real-time Search Box -->
    <input type="text" id="searchInput" class="search-box" placeholder="Search description, site, category..." oninput="filterData()">

    <!-- Multi-Select Checkbox Filters Grid -->
    <div class="filter-grid">
        <!-- 1. Category Filter -->
        <div class="dropdown" id="catDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('catDropdown')">
                <span id="catLabel">All Categories</span>
            </button>
            <div class="dropdown-content" id="catOptions">
                <!-- Dynamically Populated -->
            </div>
        </div>

        <!-- 2. Site / Project Filter -->
        <div class="dropdown" id="siteDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('siteDropdown')">
                <span id="siteLabel">All Sites / Projects</span>
            </button>
            <div class="dropdown-content" id="siteOptions">
                <!-- Dynamically Populated -->
            </div>
        </div>

        <!-- 3. Persons / Sub-names Multi-Select Filter -->
        <div class="dropdown full-width" id="nameDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('nameDropdown')">
                <span id="nameLabel">Select Persons / Names (Absala, Ismail, Thushan...)</span>
            </button>
            <div class="dropdown-content" id="nameOptions">
                <!-- Dynamically Populated -->
            </div>
        </div>
    </div>

    <!-- Summary Bar -->
    <div class="summary-bar">
        <div class="summary-item">
            <label>TOTAL ITEMS</label>
            <span id="totalCount">0</span>
        </div>
        <div class="summary-item">
            <label>TOTAL INCOME</label>
            <span class="income-text" id="totalIncome">₹0.00</span>
        </div>
        <div class="summary-item">
            <label>TOTAL EXPENSE</label>
            <span class="expense-text" id="totalExpense">₹0.00</span>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DESCRIPTION</th>
                    <th>SITE/PROJECT</th>
                    <th>AMOUNT</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="transactionBody">
                <tr>
                    <td colspan="4" class="no-data">Upload an Excel file to view data.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let rawTransactions = [];

    // Toggle Dropdown Visibility
    function toggleDropdown(id) {
        document.querySelectorAll('.dropdown').forEach(d => {
            if (d.id !== id) d.classList.remove('open');
        });
        document.getElementById(id).classList.toggle('open');
    }

    // Close Dropdowns on Clicking Outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.dropdown')) {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
        }
    });

    // Handle Uploaded Excel File and Smart Header Auto-Detection
    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // Convert to 2D array to find header row automatically
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            let headerRowIndex = -1;
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].map(c => String(c).toLowerCase().trim());
                if (row.includes('description') || row.includes('date') || row.includes('expense (aed)') || row.includes('income (aed)')) {
                    headerRowIndex = i;
                    break;
                }
            }

            if (headerRowIndex === -1) headerRowIndex = 0;

            // Parse objects starting from detected header row
            const json = XLSX.utils.sheet_to_json(worksheet, { range: headerRowIndex });
            processExcelData(json);
        };
        reader.readAsArrayBuffer(file);
    }

    function processExcelData(data) {
        rawTransactions = [];
        
        data.forEach(item => {
            // Find key names dynamically
            const descKey = Object.keys(item).find(k => k.toLowerCase().includes('desc')) || 'Description';
            const catKey = Object.keys(item).find(k => k.toLowerCase().includes('cat')) || 'Category';
            const siteKey = Object.keys(item).find(k => k.toLowerCase().includes('site') || k.toLowerCase().includes('project')) || 'Site / project';
            const expenseKey = Object.keys(item).find(k => k.toLowerCase().includes('expense')) || 'Expense (AED)';
            const incomeKey = Object.keys(item).find(k => k.toLowerCase().includes('income')) || 'Income (AED)';

            const desc = item[descKey] ? String(item[descKey]).trim() : '-';
            const cat = item[catKey] ? String(item[catKey]).trim() : '-';
            const site = item[siteKey] ? String(item[siteKey]).trim() : '-';
            
            let expense = parseFloat(item[expenseKey]) || 0;
            let income = parseFloat(item[incomeKey]) || 0;

            // Ignore 'Period totals' or empty rows
            if (desc.toLowerCase().includes('period totals') || site.toLowerCase().includes('period totals')) return;
            if (desc === '-' && cat === '-' && expense === 0 && income === 0) return;

            rawTransactions.push({
                description: desc,
                category: cat,
                site: site,
                income: income,
                expense: expense
            });
        });

        populateDropdownOptions();
        filterData();
    }

    // Populate Checkbox Dropdowns with Unique Values from Excel
    function populateDropdownOptions() {
        const categories = [...new Set(rawTransactions.map(t => t.category).filter(c => c && c !== '-'))].sort();
        const sites = [...new Set(rawTransactions.map(t => t.site).filter(s => s && s !== '-'))].sort();
        const names = [...new Set(rawTransactions.map(t => t.description).filter(d => d && d !== '-'))].sort();

        renderCheckboxes('catOptions', categories);
        renderCheckboxes('siteOptions', sites);
        renderCheckboxes('nameOptions', names);
    }

    function renderCheckboxes(containerId, items) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        if (items.length === 0) {
            container.innerHTML = '<div class="dropdown-item" style="color:#888;">No items found</div>';
            return;
        }

        items.forEach(item => {
            const label = document.createElement('label');
            label.className = 'dropdown-item';
            label.innerHTML = `<input type="checkbox" value="${item}" onchange="filterData()"> ${item}`;
            container.appendChild(label);
        });
    }

    function getSelectedValues(containerId) {
        const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
        return Array.from(checkboxes).map(cb => cb.value);
    }

    // Real-Time Filter & Render Engine
    function filterData() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedCats = getSelectedValues('catOptions');
        const selectedSites = getSelectedValues('siteOptions');
        const selectedNames = getSelectedValues('nameOptions');

        // Update Labels
        document.getElementById('catLabel').innerText = selectedCats.length ? `Category (${selectedCats.length})` : 'All Categories';
        document.getElementById('siteLabel').innerText = selectedSites.length ? `Site / Project (${selectedSites.length})` : 'All Sites / Projects';
        document.getElementById('nameLabel').innerText = selectedNames.length ? `Persons / Names (${selectedNames.length})` : 'Select Persons / Names';

        let totalInc = 0;
        let totalExp = 0;
        let matchCount = 0;

        const tbody = document.getElementById('transactionBody');
        tbody.innerHTML = '';

        rawTransactions.forEach(t => {
            const matchSearch = !searchText || 
                t.description.toLowerCase().includes(searchText) || 
                t.category.toLowerCase().includes(searchText) || 
                t.site.toLowerCase().includes(searchText);

            const matchCat = selectedCats.length === 0 || selectedCats.includes(t.category);
            const matchSite = selectedSites.length === 0 || selectedSites.includes(t.site);
            const matchName = selectedNames.length === 0 || selectedNames.includes(t.description);

            if (matchSearch && matchCat && matchSite && matchName) {
                matchCount++;
                totalInc += t.income;
                totalExp += t.expense;

                const row = document.createElement('tr');
                const displayAmt = t.expense > 0 ? `₹${t.expense.toFixed(2)}` : `₹${t.income.toFixed(2)}`;

                row.innerHTML = `
                    <td>${t.description}</td>
                    <td>${t.site}</td>
                    <td class="amount">${displayAmt}</td>
                    <td><a href="#" class="action-edit">Edit</a></td>
                `;
                tbody.appendChild(row);
            }
        });

        if (matchCount === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="no-data">No matching transactions found.</td></tr>';
        }

        document.getElementById('totalCount').innerText = matchCount;
        document.getElementById('totalIncome').innerText = `₹${totalInc.toFixed(2)}`;
        document.getElementById('totalExpense').innerText = `₹${totalExp.toFixed(2)}`;
    }

    // Export Filtered Data back to Excel
    function exportData() {
        if (rawTransactions.length === 0) {
            alert('No data available to export.');
            return;
        }
        const ws = XLSX.utils.json_to_sheet(rawTransactions);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Filtered_Transactions");
        XLSX.writeFile(wb, "Transactions_Export.xlsx");
    }
</script>

</body>
</html>
